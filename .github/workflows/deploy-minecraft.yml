name: Deploy Minecraft config

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What should be deployed?
        required: true
        default: changed
        type: choice
        options:
          - changed
          - full
      dry_run:
        description: Preview only; do not connect to the server
        required: true
        default: true
        type: boolean
      allow_deletes:
        description: Also delete allowed files removed from Git
        required: true
        default: false
        type: boolean
      include_server_properties:
        description: Include server.properties (normally leave off)
        required: true
        default: false
        type: boolean
      allow_non_main:
        description: Permit deployment from a branch other than main
        required: true
        default: false
        type: boolean
      server_stopped:
        description: Confirm the Minecraft server is stopped before live deployment
        required: true
        default: false
        type: boolean
      remove_obsolete_via_jars:
        description: Remove obsolete ViaVersion 5.9.1 and ViaBackwards 5.8.0 jars
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: minecraft-production-deploy
  cancel-in-progress: false

env:
  DEPLOY_MARKER: minecraft-production-deployed

jobs:
  plan:
    name: Build deployment plan
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard deployment branch
        shell: bash
        env:
          ALLOW_NON_MAIN: ${{ inputs.allow_non_main }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" && "${ALLOW_NON_MAIN}" != "true" ]]; then
            echo "::error::This workflow is restricted to main unless 'allow_non_main' is explicitly enabled."
            exit 1
          fi

      - name: Build allowlisted file plan
        id: plan
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          INCLUDE_SERVER_PROPERTIES: ${{ inputs.include_server_properties }}
        run: |
          set -euo pipefail
          mkdir -p deploy-plan
          : > deploy-plan/upload.txt
          : > deploy-plan/delete.txt

          is_forbidden() {
            local f="$1"
            case "$f" in
              *.jar|*.pem|*.db|*.mv.db|*.log|*.tmp) return 0 ;;
              *OneDriveCredential.json|*secrets.secret|*server_flags.dat) return 0 ;;
              plugins/Denizen/player_flags/*) return 0 ;;
              plugins/.paper-remapped/*) return 0 ;;
              */cache/*|*/tmp/*|*/backups/*|*/backup/*) return 0 ;;
              */data/*.png|*/players/*|*/upload/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          is_allowed() {
            local f="$1"

            if is_forbidden "$f"; then
              return 1
            fi

            case "$f" in
              config/paper-global.yml) return 0 ;;
              config/paper-world-defaults.yml) return 0 ;;

              plugins/Denizen/config.yml) return 0 ;;
              plugins/Denizen/scripts/*.dsc) return 0 ;;

              plugins/Multiverse-Core/config.yml) return 0 ;;
              plugins/Multiverse-Core/worlds.yml) return 0 ;;
              plugins/Multiverse-Core/anchors.yml) return 0 ;;

              plugins/Multiverse-Portals/config.yml) return 0 ;;
              plugins/Multiverse-Portals/portals.yml) return 0 ;;

              plugins/Multiverse-Inventories/config.yml) return 0 ;;
              plugins/Multiverse-Inventories/groups.yml) return 0 ;;

              plugins/Geyser-Spigot/config.yml) return 0 ;;
              plugins/floodgate/config.yml) return 0 ;;

              plugins/WorldGuard/worlds/*) return 0 ;;
              plugins/LuckPerms/config.yml) return 0 ;;

              plugins/CommandSigns/config.yml) return 0 ;;
              plugins/CommandSigns/CommandBlocks/configurations/*.json) return 0 ;;

              plugins/FastAsyncWorldEdit/config.yml) return 0 ;;
              plugins/NoFlyZone/config.yml) return 0 ;;
              plugins/SimplePushEvents/config.yml) return 0 ;;
              plugins/CourierPrime/config.yml) return 0 ;;

              server.properties)
                [[ "$INCLUDE_SERVER_PROPERTIES" == "true" ]]
                return
                ;;
              *) return 1 ;;
            esac
          }

          git fetch --tags --force

          base=""
          if [[ "$MODE" == "changed" && "${GITHUB_REF_NAME}" != "main" ]]; then
            base="origin/main"
            echo "Repair branch deployment: comparing this branch to origin/main."
          elif git rev-parse -q --verify "refs/tags/${DEPLOY_MARKER}" >/dev/null; then
            base="${DEPLOY_MARKER}"
          fi

          if [[ "$MODE" == "full" || -z "$base" ]]; then
            git ls-files > deploy-plan/candidates-upload.txt
            : > deploy-plan/candidates-delete.txt
            if [[ -z "$base" && "$MODE" == "changed" ]]; then
              echo "No previous deployment marker exists on main, so 'changed' is treated as a first full deployment."
            fi
          else
            git diff --name-only --diff-filter=ACMRT "$base" HEAD > deploy-plan/candidates-upload.txt
            git diff --name-only --diff-filter=D "$base" HEAD > deploy-plan/candidates-delete.txt
          fi

          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            if [[ -f "$f" ]] && is_allowed "$f"; then
              printf '%s\n' "$f" >> deploy-plan/upload.txt
            fi
          done < deploy-plan/candidates-upload.txt

          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            if is_allowed "$f"; then
              printf '%s\n' "$f" >> deploy-plan/delete.txt
            fi
          done < deploy-plan/candidates-delete.txt

          sort -u -o deploy-plan/upload.txt deploy-plan/upload.txt
          sort -u -o deploy-plan/delete.txt deploy-plan/delete.txt

          upload_count="$(wc -l < deploy-plan/upload.txt | tr -d ' ')"
          delete_count="$(wc -l < deploy-plan/delete.txt | tr -d ' ')"

          echo "upload_count=$upload_count" >> "$GITHUB_OUTPUT"
          echo "delete_count=$delete_count" >> "$GITHUB_OUTPUT"

          {
            echo "## Minecraft deployment plan"
            echo
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Mode: \`$MODE\`"
            echo "- Uploads: **$upload_count**"
            echo "- Deletions detected: **$delete_count**"
            echo "- Dry run: **${{ inputs.dry_run }}**"
            echo "- Remote deletions enabled: **${{ inputs.allow_deletes }}**"
            echo "- Remove obsolete Via jars: **${{ inputs.remove_obsolete_via_jars }}**"
            echo
            echo "### Upload"
            if [[ "$upload_count" == "0" ]]; then
              echo "_None_"
            else
              sed 's/^/- `/; s/$/`/' deploy-plan/upload.txt
            fi
            echo
            echo "### Deleted in Git"
            if [[ "$delete_count" == "0" ]]; then
              echo "_None_"
            else
              sed 's/^/- `/; s/$/`/' deploy-plan/delete.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save deployment plan
        uses: actions/upload-artifact@v6
        with:
          name: minecraft-deploy-plan
          path: deploy-plan/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy over FTP
    needs: plan
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    environment: minecraft-production

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download deployment plan
        uses: actions/download-artifact@v7
        with:
          name: minecraft-deploy-plan
          path: deploy-plan

      - name: Require stopped-server confirmation
        shell: bash
        env:
          SERVER_STOPPED: ${{ inputs.server_stopped }}
        run: |
          set -euo pipefail
          if [[ "${SERVER_STOPPED}" != "true" ]]; then
            echo "::error::Stop the Minecraft server before a live FTP deployment, then re-run with server_stopped=true."
            exit 1
          fi

      - name: Validate connection settings
        shell: bash
        env:
          MC_FTP_HOST: ${{ secrets.MC_FTP_HOST || secrets.MC_FTP_HOST }}
          MC_FTP_PORT: ${{ secrets.MC_FTP_PORT || secrets.MC_FTP_PORT }}
          MC_FTP_USER: ${{ secrets.MC_FTP_USER || secrets.MC_FTP_USER }}
          MC_FTP_PATH: ${{ secrets.MC_FTP_PATH || secrets.MC_FTP_PATH }}
          MC_FTP_PASSWORD: ${{ secrets.MC_FTP_PASSWORD || secrets.MC_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          : "${MC_FTP_HOST:?MC_FTP_HOST/MC_FTP_HOST is not configured}"
          : "${MC_FTP_USER:?MC_FTP_USER/MC_FTP_USER is not configured}"
          : "${MC_FTP_PATH:?MC_FTP_PATH/MC_FTP_PATH is not configured}"
          : "${MC_FTP_PASSWORD:?MC_FTP_PASSWORD/MC_FTP_PASSWORD is not configured}"

          echo "FTP connection settings are present."
          echo "Port: ${MC_FTP_PORT:-21}"

      - name: Install FTP client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Build FTP batch
        shell: bash
        env:
          MC_FTP_PATH: ${{ secrets.MC_FTP_PATH || secrets.MC_FTP_PATH }}
          ALLOW_DELETES: ${{ inputs.allow_deletes }}
        run: |
          set -euo pipefail
          batch="deploy-plan/ftp.batch"
          : > "$batch"

          printf 'set cmd:fail-exit yes\n' >> "$batch"
          printf 'set net:max-retries 2\n' >> "$batch"
          printf 'set net:timeout 20\n' >> "$batch"
          printf 'set net:reconnect-interval-base 5\n' >> "$batch"
          printf 'set ftp:passive-mode true\n' >> "$batch"
          printf 'set ftp:ssl-allow yes\n' >> "$batch"
          printf 'set ssl:verify-certificate yes\n' >> "$batch"
          printf 'cd "%s"\n' "${MC_FTP_PATH}" >> "$batch"

          while IFS= read -r f; do
            [[ -n "$f" ]] || continue

            parent="$(dirname "$f")"
            if [[ "$parent" != "." ]]; then
              current=""
              IFS='/' read -ra parts <<< "$parent"
              for part in "${parts[@]}"; do
                current="${current:+$current/}$part"
                printf 'mkdir -p "%s"\n' "$current" >> "$batch"
              done
            fi

            printf 'put "%s" -o "%s"\n' "$f" "$f" >> "$batch"
          done < deploy-plan/upload.txt

          if [[ "$ALLOW_DELETES" == "true" ]]; then
            while IFS= read -r f; do
              [[ -n "$f" ]] || continue
              printf 'rm -f "%s"\n' "$f" >> "$batch"
            done < deploy-plan/delete.txt
          fi

          if [[ "${{ inputs.remove_obsolete_via_jars }}" == "true" ]]; then
            printf 'rm -f "plugins/ViaVersion-5.9.1.jar"\n' >> "$batch"
            printf 'rm -f "plugins/ViaBackwards-5.8.0.jar"\n' >> "$batch"
          fi

          printf 'bye\n' >> "$batch"
          echo "FTP batch prepared with $(wc -l < "$batch" | tr -d ' ') commands."

      - name: Deploy
        shell: bash
        env:
          MC_FTP_HOST: ${{ secrets.MC_FTP_HOST || secrets.MC_FTP_HOST }}
          MC_FTP_PORT: ${{ secrets.MC_FTP_PORT || secrets.MC_FTP_PORT }}
          MC_FTP_USER: ${{ secrets.MC_FTP_USER || secrets.MC_FTP_USER }}
          MC_FTP_PASSWORD: ${{ secrets.MC_FTP_PASSWORD || secrets.MC_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          port="${MC_FTP_PORT:-21}"

          lftp \
            -u "${MC_FTP_USER}","${MC_FTP_PASSWORD}" \
            -p "$port" \
            "${MC_FTP_HOST}" \
            -f deploy-plan/ftp.batch

      - name: Mark successful deployment
        shell: bash
        run: |
          set -euo pipefail
          git tag -f "${DEPLOY_MARKER}" "${GITHUB_SHA}"
          git push origin "refs/tags/${DEPLOY_MARKER}" --force

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## Deployment complete"
            echo
            echo "Deployed \`${GITHUB_SHA}\` from \`${GITHUB_REF_NAME}\`."
            echo
            echo "This workflow does **not** restart or reload the Minecraft server."
          } >> "$GITHUB_STEP_SUMMARY"
